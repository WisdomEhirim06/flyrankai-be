<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: -0.025em;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button.btn-add {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-add:hover {
            background: var(--accent-hover);
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .task-info input[type="checkbox"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            padding: 12px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>To-Do List</h1>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task..." id="task-input">
            <button class="btn-add" onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/tasks";

        async function fetchTasks() {
            try {
                const res = await fetch(API_URL);
                const tasks = await res.json();
                renderTasks(tasks);
            } catch (err) {
                console.error("Failed to fetch tasks:", err);
            }
        }

        function renderTasks(tasks) {
            const list = document.getElementById("taskList");
            list.innerHTML = "";

            if (tasks.length === 0) {
                list.innerHTML = '<div class="empty-state">No tasks yet! Add one above.</div>';
                return;
            }

            tasks.forEach(task => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <div class="task-info">
                        <input type="checkbox" ${task.done ? "checked" : ""} onchange="toggleTask(${task.id}, '${task.task}', this.checked)">
                        <span class="task-text ${task.done ? 'completed' : ''}">${task.task}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteTask(${task.id})">&times;</button>
                `;
                list.appendChild(li);
            });
        }

        async function addTask() {
            const input = document.getElementById("taskInput");
            const title = input.value.trim();
            if (!title) return;

            try {
                await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task: title, done: false })
                });
                input.value = "";
                fetchTasks();
            } catch (err) {
                console.error("Failed to add task:", err);
            }
        }

        async function toggleTask(id, taskText, isDone) {
            try {
                await fetch(`${API_URL}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task: taskText, done: isDone })
                });
                fetchTasks();
            } catch (err) {
                console.error("Failed to update task:", err);
            }
        }

        async function deleteTask(id) {
            try {
                await fetch(`${API_URL}/${id}`, { method: "DELETE" });
                fetchTasks();
            } catch (err) {
                console.error("Failed to delete task:", err);
            }
        }

        // Allow pressing Enter to add task
        document.getElementById("taskInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") addTask();
        });

        // Load tasks on startup
        fetchTasks();
    </script>
</body>
</html>
